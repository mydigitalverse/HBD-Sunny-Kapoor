:root[data-theme="dark"]{--bg:#1b1115;--card:#2a1a20;--tx:#fbe9ed;--mu:#d6aeb8;--bl:#2a1a20;--rose:#4a2430;--r:#ff5d73;--hd:rgba(27,17,21,.9)}
*{box-sizing:border-box}html{scroll-padding-top:70px;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.7 Poppins,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,9vw,4.6rem);color:var(--rd)}h2{font-size:clamp(1.6rem,6vw,2.6rem);color:var(--rd)}h3{font-size:1.15rem;color:var(--r)}
p{margin:0 0 1em}a{color:var(--r)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--rose)}
.brand{font-family:Caveat,cursive;font-size:1.5rem;color:var(--r);text-decoration:none}
#sb{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--r);border-radius:99px;background:var(--bl);color:var(--rd);font:500 .95rem Poppins,sans-serif;cursor:pointer}
#sb i{width:18px;height:2px;background:currentColor;box-shadow:0 6px currentColor,0 -6px currentColor;display:block}
#nav{position:fixed;inset:0 0 0 auto;width:min(360px,100%);background:var(--bg);z-index:40;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;overflow:auto;transform:translateX(105%);transition:transform .35s;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#nav.o{transform:none}#nav a{display:block;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--tx)}#nav a:hover,#nav a.on{background:var(--rose);color:var(--rd)}
#nav .x{float:right;min-height:44px;min-width:44px;border:0;background:var(--bl);border-radius:50%;font-size:1.3rem;color:var(--rd);cursor:pointer}
#sh{position:fixed;inset:0;background:rgba(52,35,41,.45);z-index:35;display:none}#sh.o{display:block}
main{max-width:1000px;margin:auto;padding:28px 18px 60px;position:relative;z-index:1;animation:fi .7s both}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.c{text-align:center}.sub{color:var(--mu);max-width:36em;margin-inline:auto}
.hero{background:linear-gradient(160deg,var(--bl),var(--bg));border-radius:28px;padding:28px 16px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 24px;margin:6px;border-radius:99px;border:2px solid var(--r);background:var(--r);color:#fff;font:500 1rem Poppins,sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(215,38,61,.3)}.btn.s{background:var(--bg);color:var(--r)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}
.cd{background:var(--card);border:1px solid var(--rose);border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(164,22,42,.08);transition:transform .25s}.cd:hover{transform:translateY(-4px)}
.cd p{margin:0}.cd .n{font-size:1.5rem}
.fr{margin:0;background:#fff;padding:10px 10px 14px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.18);color:#342329;max-width:100%}
.fr img{display:block;width:100%;height:auto;border-radius:8px}.fr figcaption{font:1.15rem Caveat,cursive;text-align:center;padding-top:8px}
.fr.t{transform:rotate(-2deg)}.fr.u{transform:rotate(2deg)}.one{width:min(340px,88%);margin:20px auto}
.stks{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:18px 0}
.stks img{height:clamp(120px,30vw,200px);width:auto;margin:0 -6px;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.stks img:nth-child(odd){transform:rotate(-5deg)}.stks img:nth-child(even){transform:rotate(4deg)}
.gal{columns:2 220px;column-gap:16px}.gal button{display:block;width:100%;margin:0 0 16px;border:0;background:none;padding:0;cursor:pointer;break-inside:avoid}
.gal .fr{transition:transform .3s}.gal button:hover .fr{transform:scale(1.03) rotate(0)}
.letter{background:#fffaf5;color:#4a2f36;border-radius:8px;padding:clamp(20px,5vw,48px);font:1.35rem/1.65 Caveat,cursive;box-shadow:0 12px 30px rgba(0,0,0,.15);border-left:6px solid var(--r);margin-top:20px}
.q{font-family:'Playfair Display',serif;font-size:1.05rem}.q .btn{min-height:44px;padding:6px 16px;font-size:.85rem}
.q:nth-child(3n+1){background:var(--bl)}.q:nth-child(3n){background:var(--r);color:#fff}.q:nth-child(3n) .btn{background:#fff;color:var(--rd);border-color:#fff}
.wall{columns:2 200px;column-gap:14px}.wall div{break-inside:avoid;margin:0 0 14px;padding:16px;border-radius:6px;font:1.3rem/1.4 Caveat,cursive;box-shadow:0 5px 14px rgba(0,0,0,.15);color:#342329}
.big{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--rd)}
.tm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.tm div{min-width:72px;padding:12px;background:var(--bl);border-radius:16px;border:1px solid var(--rose)}.tm b{display:block;font:700 1.9rem 'Playfair Display',serif;color:var(--r)}
.fin{background:#fff;color:#342329;border-radius:28px;padding:28px 18px;text-align:center;border:2px solid var(--rose)}.fin .big{color:var(--rd)}
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--rd);color:#fff;padding:10px 20px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}#tt.o{opacity:1}
#lb{position:fixed;inset:0;background:rgba(20,8,12,.93);z-index:70;display:none;align-items:center;justify-content:center;padding:56px 8px}#lb.o{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}#lb p{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font:1.3rem Caveat,cursive;margin:0}
#lb button{position:absolute;min-width:48px;min-height:48px;border:0;border-radius:50%;background:#fff;color:var(--rd);font-size:1.4rem;cursor:pointer}
#lc{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}#lp{left:8px}#ln{right:8px}
.hh{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.hh span{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.35}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
.cf{position:fixed;top:-30px;z-index:80;pointer-events:none;animation:dn 3s ease-in forwards}@keyframes dn{to{transform:translateY(110vh) rotate(360deg)}}
:focus-visible{outline:3px solid var(--r);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hh{display:none}}
footer{text-align:center;color:var(--mu);padding:24px 16px 40px;border-top:1px solid var(--rose)}

const WISH=["Babu, tumhari smile hamesha aisi hi bani rahe. Chhoti-chhoti baaton mein bhi tumhe khushi milti rahe.","Sona, dimaag ko sukoon mile aur dil halka rahe. Tension aaye bhi toh zyada der tik na paaye.","Jaan, apni sehat ka khayal rakhna. Time pe khana, poori neend, aur thoda sa time sirf apne liye.","Motu, Zork Elevators din-ba-din tarakki kare. Tumhari mehnat rang laaye aur achhe clients aur opportunities milte rahein.","Kuchu Puchu, har naya challenge tumhe kuch sikha ke jaye aur tumhara confidence aur strong ho.","Samosa, jo bhi sapne tumne dekhe hain, ek-ek karke poore hon. Main hamesha tumhare saath hoon.","Jigar ke tukde, tumhare aas-paas hamesha achhe aur sacche log rahein jo tumhe sachmuch samjhein.","Babu, naya saal naye experiences laye: nayi jagahein, nayi baatein, aur dher saari achhi yaadein.","Sona, kaam mein team ke saath coordination achha rahe, decisions sahi hon aur growth stable rahe.","Mere dil ke sukoon, apni khushi ko hamesha upar rakhna. Tumhari khushi mere liye matter karti hai. ❤️"];
const SPEC=["Babu, tumhari apni ek alag pehchaan hai. Tumhari jagah duniya mein koi aur nahi le sakta.","Sona, tum jab saath hote ho toh maahaul apne aap halka lagta hai.","Motu, tumhare sapne bade hain aur unke liye jo mehnat tum karte ho, woh main dekhta hoon.","Jaan, tumhari feelings matter karti hain, chahe tum unhe bolo ya na bolo.","Kuchu Puchu, tumhara dekhne ka apna nazariya hai, aur mujhe woh bahut pasand hai.","Samosa, tum seekhte ho, aage badhte ho, aur har saal pehle se behtar hote ho.","Jigar ke tukde, tumhare saath bani yaadein mere liye bahut keemti hain.","Mere dil ke sukoon, tum un logon ke liye bahut important ho jo tumse pyaar karte hain. Aur main unmein sabse upar hoon. 😄"];
const QT=["Tum meri kahaani ka sirf ek hissa nahi, woh ehsaas ho jo har page ko special bana deta hai. ❤️","Tumse baat karke din ka sara thakaan kam ho jata hai.","Pyaar bade-bade vaadon se nahi, roz ki chhoti care se dikhta hai.","Tumhari khushi meri list mein hamesha upar rehti hai.","Sach bolun toh, tumhare saath chup baithna bhi achha lagta hai.","Bharosa ek din mein nahi banta, roz thoda-thoda banta hai. Aur main roz koshish karunga.","Tum jaise ho, waise hi bahut ho. Kuch badalne ki zarurat nahi.","Chai ho ya lambi drive, sab tumhare saath khaas ho jata hai.","Mere liye tum ek aisi jagah ho jahan dil ko sukoon milta hai.","Respect aur pyaar saath-saath chalte hain, aur main dono dena chahta hoon.","Tumhare sapne mere liye bhi utne hi important hain jitne tumhare liye.","Aaj ka din tumhara hai, aur main bahut khush hoon ki main tumhare saath hoon.","Har naya saal ek naya page hai. Chalo isse khoobsurat banate hain.","Tumhari ek muskaan mere poore din ka mood bana deti hai.","Pyaar matlab saath rehna, sunna, samajhna, aur kabhi haath na chhodna."];
const PRM=["Main tumhari baat dhyaan se sununga, bina beech mein kaate.","Main hamesha honestly baat karunga, chahe baat chhoti ho ya badi.","Tumhari boundaries ki izzat karunga aur tumhe space bhi dunga.","Tumhari har achievement ko dil se celebrate karunga, chahe kitni bhi chhoti ho.","Tumhare growth mein saath dunga aur tumhare sapno ko support karunga.","Busy schedule mein bhi tumse meaningful baat karne ka time nikalunga.","Roz ki chhoti-chhoti khushiyon ko notice karunga aur unki value karunga.","Jab kabhi hum disagree karenge, shaanti se aur izzat ke saath baat karunga.","Pyaar sirf bol kar nahi, chhoti-chhoti thoughtful cheezein karke dikhaunga."];
const BLS=["Tumhe hamesha khushi mile, woh wali jo dil se aati hai.","Sehat achhi rahe, energy bani rahe, aur har din fresh feel ho.","Mann mein shanti rahe, chahe bahar kitna bhi shor ho.","Tumhara confidence har din thoda aur badhe.","Zork Elevators mein meaningful success mile aur business sahi raaste par badhta rahe.","Naye opportunities tumhare darwaze par khud dastak dein.","Mushkil dino mein tumhe himmat aur sabr mile.","Tumhare aas-paas hamesha supportive aur achhe log rahein.","Tumhe apne kaam ke saath apne liye aur apno ke liye bhi time mile.","Paison ki taraf se stability aur sukoon rahe.","Tumhe sachchi, pyaari experiences milein jo hamesha yaad rahein.","Aane wala kal umeedon se bhara ho, aur tum usse poore confidence se jiyo."];
const NOTES=["Babu, tumhari khushi mere liye genuinely matter karti hai.","Aaj ka din tumhare naam, aur yeh surprise bhi.","Sona, main chahta hoon tumhari life mein bahut saari beautiful memories aayein.","Tum jaise ho, waise hi special ho.","Zork Elevators ke liye bhi dher saari shubhkamnayein. Tum kar loge.","Is naye saal mein tumhe sukoon, sehat aur khushi mile."];
const DRM=[["Naye Experiences","Nayi jagahein dekhna, naye khaane try karna, aur bas kuch naya karna. Jab bhi mauka mile."],["Saath Mein Hasna","Wo wali hansi jo pet dukha de. Aisi bahut saari baatein aur honi chahiye."],["Dil Ki Baatein","Der raat tak ki lambi baatein, jahan koi jaldi nahi hoti."],["Ek Doosre Ke Sapne","Tumhare goals mein main saath hoon. Jab tum thake ho, main cheer karunga."],["Zork Ka Safar","Main chahta hoon Zork Elevators tumhare sapno ke jitna bada bane, aur tumhe uska achha result mile."],["Saath Mein Badhna","Hum dono apni jagah badhein, aur ek doosre ko badhte hue dekhein."]];
const WALL=["Keep shining, Babu! ✨","Tumhari smile hamesha bani rahe.","May your dreams find their way to reality.","Zork Elevators ko ek aur ooncha level mile! 🚀","Aaj ka din utna hi special ho jitne tum ho.","More happiness, more peace, more beautiful memories.","Sona, apne aap pe hamesha proud feel karo.","Kaam ke saath apna khayal bhi rakhna. ❤️","Tumhari life khushiyon se bhari rahe.","Jaan, tum bahut achhe ho. Yeh yaad rakhna.","Business mein achhe clients aur achhi growth. 🙌","Motu, aaj thodi si masti toh banti hai! 🎉","Tumhare saath har din special hai.","Mere dil ke sukoon, Happy Birthday! 🎂"];
const COL=["#FFF0F3","#F8D7DE","#fff","#FFE1E6","#fff6f0"];
const CAP=["Tumhari smile, meri favourite feeling ❤️","Ek tasveer, hazaar feelings.","Tum ho, toh har frame special hai.","Bas tum aur tumhari khoobsurat si vibe.","Mera favourite insaan.","Dekhta hi rehta hoon.","Style bhi tumhara, swag bhi tumhara.","Tumhari baat hi alag hai."];
const R={};
R['sirf-tumhare-naam']=()=>`<div class="hero"><p class="sub">29 October</p><h1>Sunny Kapoor</h1><p class="big">Babu, aaj ka din sirf tumhare naam ❤️</p><p class="sub">29 October sirf ek date nahi hai. Yeh us insaan ka special din hai jiski smile mere din ko aur khoobsurat bana deti hai.</p><div class="one">${ph(2,'Tumhare liye, pyaar se','t')}</div><p><a class="btn" href="#birthday-celebration">Chalo, Tumhari Special Duniya Explore Karein ❤️</a><a class="btn s" href="#little-surprise">Ek Chhota Sa Surprise Hai ✨</a></p>${sk(0,4,6)}<p class="sub" aria-hidden="true">Neeche scroll karo ↓</p></div><p class="c" style="margin-top:28px">Maine yeh chhoti si duniya tumhare liye banayi hai. Aaram se ghoomo, jahan dil kare wahan jao. Upar <b>Safar</b> button se sab kuch mil jayega. ❤️</p>`;
R['birthday-celebration']=()=>`<div class="hero"><h1>Happy Birthday, Motu! 🎂❤️</h1><svg viewBox="0 0 120 110" width="150" role="img" aria-label="Birthday cake"><rect x="20" y="55" width="80" height="45" rx="8" fill="#D7263D"/><path d="M20 70q10 12 20 0t20 0 20 0 20 0v-10H20z" fill="#fff"/><rect x="28" y="38" width="64" height="20" rx="6" fill="#F8D7DE"/><rect x="56" y="20" width="8" height="18" fill="#A4162A"/><path d="M60 8c8 8 4 12 0 12s-8-4 0-12z" fill="#ffb703"/></svg><p>Babu, tumhara aaj ka din bahut achha jaye. Main chahta hoon ki aaj tum sirf khush raho, hanso, aur khud ko thoda pamper bhi karo.</p><p>Tumhari mehnat, tumhare sapne, aur tumhara saath. Main in sab ke liye grateful hoon. Aane wala saal tumhare liye bahut saari khushiyan, sukoon aur success laye.</p><p class="big">Dil se dua: tum hamesha khush raho. 🌹</p>${sk(1,3)}<button class="btn s" id="rp">Dobara Celebrate Karo 🎉</button><br><a class="btn" href="#birthday-wishes">Wishes Padho ❤️</a></div>`;
R['birthday-wishes']=()=>hd('Dil Se Nikli Birthday Wishes','Babu, yeh sab tumhare liye.')+cards(WISH,['🌸','✨','💖','🎈'])+sk(5,2)+nx('our-love-story','Aage Chalo ❤️');
R['our-love-story']=()=>hd('Humari Si Kahaani','Pyaar ko shabdon mein likhna mushkil hai, par koshish karta hoon.')+`<div class="g"><div class="cd"><h3>Ek Connection Jo Special Lagta Hai</h3><p>Kuch log aise hote hain jinke saath rehkar sab kuch aasaan lagta hai. Tum mere liye wahi ho, Jaan.</p></div><div class="cd"><h3>Tumhari Presence Ki Apni Hi Baat Hai</h3><p>Tum paas ho ya door, tumhara hona hi mere liye bahut matter karta hai.</p></div><div class="cd"><h3>Chhoti-Chhoti Baatein, Badi Si Khushi</h3><p>Ek message, ek call, ek muskaan. Inhi se toh din bante hain.</p></div><div class="cd"><h3>Aage Ki Kahaani, Saath Milkar</h3><p>Main chahta hoon ki hum aage bhi aise hi ek doosre ko samajhte rahein.</p></div></div><div class="one">${ph(1,'Mera favourite insaan','u')}</div>`+nx('sunny-photo-gallery','Tasveerein Dekho 📸');
R['sunny-photo-gallery']=()=>hd('Tumhari Pyaari Tasveerein','Kisi bhi tasveer par tap karo aur badi karke dekho.')+`<div class="gal" style="margin-top:24px">${P.map((_,i)=>`<button data-i="${i}" aria-label="Tasveer ${i+1} badi karke dekho">${ph(i,CAP[i],i%2?'u':'t')}</button>`).join('')}</div>`+sk(0,1,2,3);
R['why-you-are-special']=()=>hd('Tum Itne Special Kyun Ho','Kuch baatein jo main aksar sochta hoon.')+cards(SPEC,'💝')+sk(4,5,6)+nx('love-letter','Mera Khat Padho ❤️');
R['love-letter']=()=>hd('Ek Khat Sirf Tumhare Liye')+`<div class="one">${ph(3,'Tumhare liye','t')}</div><div class="letter"><p>Babu,</p><p>Aaj tumhara birthday hai aur sach bolun toh samajh nahi aa raha kahan se shuru karun. Isliye seedhe dil ki baat likh raha hoon.</p><p>Sabse pehle, thank you. Tum meri life mein ho, yeh mere liye bahut badi baat hai. Din kaisa bhi ho, tumse baat karke sab halka lagta hai. Tumhari smile dekhta hoon toh mera din achha ho jata hai.</p><p>Mujhe pata hai tum bahut mehnat karte ho. Zork Elevators ko aage le jaana aasaan nahi hota, kabhi pressure, kabhi bade decisions, kabhi lambe din. Main tumpe proud feel karta hoon. Bas ek request hai: kaam ke saath apna khayal bhi rakhna. Time pe khana khana, thoda rest karna, aur jab thak jao toh mujhse baat kar lena. Main sunne ke liye hamesha hoon.</p><p>Main perfect nahi hoon, aur kabhi-kabhi galtiyan bhi hoti hain. Par main koshish karta rahunga ki tumhe samjhun, tumhari baat dhyaan se sunu, aur jahan zarurat ho wahan tumhare saath khada rahun. Jo vaade main nibha sakta hoon, wahi karunga.</p><p>Tumhare liye meri wish simple hai: tum khush raho, healthy raho, aur tumhe apni mehnat ka achha result mile. Tumhare dreams poore hon, aur raaste mein jo bhi mushkil aaye, tum usse nikal jao. Main ek taraf khada tumhe cheer karta rahunga.</p><p>Aage bahut saare din hain, bahut saari baatein, aur bahut saari yaadein jo hum abhi banayenge. Main un sab ka intezaar karta hoon.</p><p>Happy Birthday, mere dil ke sukoon. Tum jaise ho, bilkul waise hi mujhe pyaare ho.</p><p>With all my love, sirf tumhare liye. ❤️</p></div>`+nx('love-quotes','Kuch Quotes ❤️');
R['love-quotes']=()=>hd('Kuch Dil Wali Baatein','Kuch pyaari baatein, sirf tumhare liye.')+`<div class="g">${QT.map((t,i)=>`<div class="cd q"><p>${t}</p></div>`).join('')}</div>`;
R['birthday-promises']=()=>hd('Tumhare Liye Kuch Dil Se Kiye Gaye Vaade ❤️','Yeh meri sacchi koshishein hain, bade-bade daave nahi.')+cards(PRM,['🤝','💌','🌷'])+sk(3,6)+nx('blessings-and-good-wishes','Duayein Padho 🌸');
R['blessings-and-good-wishes']=()=>hd('Tumhare Liye Dher Saari Duayein','Aane wali life ke liye dil se.')+`<div class="one">${ph(4,'Hamesha khush raho','u')}</div>`+cards(BLS,['🕊️','🌿','☀️','🌸'])+nx('little-surprise','Ek Surprise Hai ✨');
let ni=0;R['little-surprise']=()=>{ni=0;return hd('Ek Chhota Sa Surprise','Ek baar tap karo, phir dekho.')+`<div class="c"><button class="btn" id="sp">Tap Karo, Ek Surprise Hai ❤️</button></div><div id="nt" class="g" aria-live="polite"></div><div id="sf"></div>`};
R['our-future-dreams']=()=>hd('Abhi Toh Bahut Saari Khoobsurat Kahaaniyaan Baaki Hain ✨','Umeed, pyaar aur thoda sa sapna.')+`<div class="g">${DRM.map(d=>`<div class="cd"><h3>${d[0]}</h3><p>${d[1]}</p></div>`).join('')}</div><div class="one">${ph(5,'Aage bhi aise hi','t')}</div>`+nx('birthday-wish-wall','Wish Wall ❤️');
R['birthday-wish-wall']=()=>hd('Khushiyon Bhari Chhoti-Chhoti Baatein')+`<div class="wall" style="margin-top:24px">${WALL.map((w,i)=>`<div style="background:${COL[i%5]};transform:rotate(${(i%3-1)*1.5}deg)">${w}</div>`).join('')}</div>`+sk(0,2,5);
let tm;R['birthday-countdown']=()=>hd('29 October Ka Intezaar')+`<div id="cdw" class="c"></div><div class="one">${ph(6,'Tumhara din aa raha hai','u')}</div><p class="c"><button class="btn s" id="pv">Celebration Dekho ✨</button></p>`;
R['one-last-message']=()=>`<div class="fin"><div class="one">${ph(7,'Mera sab kuch','t')}</div>${sk(0,3)}<p class="big">Happy Birthday, Sunny Kapoor.</p><p>Tumhari life ka har naya chapter khushiyon, sukoon, pyaar aur khoobsurat surprises se bhara ho. Zork Elevators ka safar tarakki ke saath chalta rahe. Aur aaj ke din, bas itna yaad rakhna: tum special ho, aur tumhari khushi matter karti hai. ❤️</p><p>Main tumhare saath hoon, hamesha. Jaan, tumse bahut pyaar hai.</p><a class="btn" href="#sirf-tumhare-naam">Wapas Shuru Se ❤️</a></div>`;
R['tumhari-duniya']=()=>hd('Tumhare Liye Banayi Gayi Chhoti Si Duniya ❤️','Jo kuch maine tumhare liye banaya hai, sab yahan hai.')+`<div class="g">${PG.map((p,i)=>{const im=i<8?P[i]:S[i-8];return `<a class="cd" style="display:block;text-decoration:none;color:inherit" href="#${p[0]}" ${p[0]==='tumhari-duniya'?'aria-current="page"':''}><h3>${p[1]}</h3><p>${p[2]}</p>${p[0]==='tumhari-duniya'?'<p><b>Tum Yahin Ho</b></p>':''}</a>`}).join('')}</div>`;
const RN={'birthday-celebration':()=>{boom();const b=$('#rp');if(b)b.onclick=boom},'sunny-photo-gallery':()=>document.querySelectorAll('.gal button').forEach(b=>b.onclick=()=>lbo(+b.dataset.i)),
'love-quotes':()=>document.querySelectorAll('.cp').forEach(b=>b.onclick=()=>cpy(QT[b.dataset.i])),
'little-surprise':()=>{$('#sp').onclick=function(){if(1){const d=document.createElement('div');d.className='cd';d.innerHTML=`<img src="${P[ni]}" alt="Tumhari tasveer" style="width:100%;height:auto;border-radius:12px;margin-bottom:10px"><p>${NOTES[ni]}</p>`;$('#nt').appendChild(d);d.scrollIntoView({block:'center',behavior:'smooth'});ni++;this.textContent='Aur Ek ❤️'}if(ni>=NOTES.length){this.remove();boom();$('#sf').innerHTML=`<div class="fin" style="margin-top:20px"><p class="big">Happy Birthday, Babu! 🎂</p>${sk(2,6)}<p>Tum meri life ka sabse achha hissa ho. ❤️</p></div>`}}},
'birthday-countdown':()=>{let pv=0;const u=()=>{const n=new Date(),y=n.getFullYear(),sod=new Date(y,n.getMonth(),n.getDate());let t=new Date(y,9,29),w=$('#cdw');if(!w)return;
if(pv||sod.getTime()===t.getTime()){w.innerHTML=`<p class="big">29 October. Aaj Sunny Kapoor Ka Birthday Hai! ❤️</p><p>Aaj ka din bas tumhara hai, Babu. Khoob celebrate karo! 🎉</p>`;return}
if(t<sod)t=new Date(y+1,9,29);let d=t-n;const f=(v,l)=>`<div><b>${v}</b>${l}</div>`;const s=Math.floor(d/1e3);w.innerHTML=`<p class="sub">Tumhare birthday mein bas itna time baaki hai:</p><div class="tm">${f(Math.floor(s/86400),'Din')}${f(Math.floor(s%86400/3600),'Ghante')}${f(Math.floor(s%3600/60),'Minute')}${f(s%60,'Second')}</div><p>29 October, Motu ka din! 🎂</p>`};
u();tm=setInterval(u,1000);$('#pv').onclick=function(){pv=!pv;u();this.textContent=pv?'Wapas Countdown 🕒':'Celebration Dekho ✨';if(pv)boom()}}};
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<36;i++){const e=document.createElement('span');e.className='cf';e.textContent=['❤️','🎉','✨','🌸','🎈'][i%5];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('o');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('o'),2000)}
function cpy(t){const ok=()=>toast('Copy ho gaya ❤️');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copy nahi ho paya')}a.remove()}}
let li=0;function lbo(i){li=(i+P.length)%P.length;$('#li').src=P[li];$('#li').alt='Tumhari tasveer';$('#lt').textContent=CAP[li];$('#lb').classList.add('o');$('#lc').focus()}
function lbx(){$('#lb').classList.remove('o')}
$('#lc').onclick=lbx;$('#lp').onclick=()=>lbo(li-1);$('#ln').onclick=()=>lbo(li+1);$('#lb').onclick=e=>{if(e.target.id==='lb')lbx()};
function nav(o){$('#nav').classList.toggle('o',o);$('#sh').classList.toggle('o',o);$('#sb').setAttribute('aria-expanded',o);$('#sb').setAttribute('aria-label',o?'Safar band karo':'Safar kholo');$('#nav').setAttribute('aria-hidden',!o);if(o)$('#nx').focus();else $('#sb').focus()}
$('#sb').onclick=()=>nav(!$('#nav').classList.contains('o'));$('#nx').onclick=()=>nav(0);$('#sh').onclick=()=>nav(0);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){lbx();if($('#nav').classList.contains('o'))nav(0)}if($('#lb').classList.contains('o')){if(e.key==='ArrowRight')lbo(li+1);if(e.key==='ArrowLeft')lbo(li-1)}});
let cur='';
function show(s){clearInterval(tm);cur=s;const i=ix(s),m=$('#m');lbx();
if(i<0){document.title='Chalo Wapas ❤️';m.innerHTML=`<div class="hero"><h2>Yeh wali baat abhi nahi mil rahi.</h2><p>Chalo, wapas tumhari special duniya mein chalte hain. ❤️</p><a class="btn" href="#sirf-tumhare-naam">Sirf Tumhare Naam ❤️</a></div>`}
else{document.title=i?PG[i][1]+' ❤️ | Tumhare Liye':'Happy Birthday Sunny Kapoor ❤️ | A Special Birthday Surprise';m.innerHTML=R[s]();if(RN[s])RN[s]()}
document.querySelectorAll('#nl a').forEach(a=>{a.classList.toggle('on',a.getAttribute('href')==='#'+s);a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+s)});window.scrollTo(0,0)}
function go(s){try{if(location.hash.slice(1)!==s)history.replaceState(null,'','#'+s)}catch(e){}show(s)}
$('#nl').innerHTML=PG.map(p=>`<a href="#${p[0]}">${p[1]}</a>`).join('');
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();nav(0);go(a.getAttribute('href').slice(1))});
addEventListener('hashchange',()=>{const s=location.hash.slice(1)||PG[0][0];if(s!==cur)show(s)});
const hh=$('#hh');for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['❤️','💗','🌸'][i%3];s.style.cssText=`left:${i*7.3}%;font-size:${14+i%4*6}px;animation-duration:${14+i%5*4}s;animation-delay:-${i*2}s`;hh.appendChild(s)}
show(location.hash.slice(1)||PG[0][0]);
</script></body></html>
